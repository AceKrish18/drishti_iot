<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: white;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.7), 0 0 20px rgba(0, 229, 255, 0.5);
            animation: fadeIn 1s ease-out forwards;
        }

        .button-container {
            display: flex;
            gap: 20px;
            animation: fadeIn 1s ease-out 0.5s forwards;
            opacity: 0;
        }

        .feature-btn {
            padding: 15px 35px;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid;
            border-radius: 50px;
            color: white;
            transition: all 0.3s ease;
            font-weight: bold;
            background-color: transparent;
        }

        #startDetectionBtn {
            border-color: #00e5ff;
            color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        #startDetectionBtn:hover {
            background-color: #00e5ff;
            color: #111;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8), 0 0 5px rgba(0, 229, 255, 1);
        }

        #stop-btn {
            border-color: #e53935;
            color: #e53935;
            box-shadow: 0 0 15px rgba(229, 57, 53, 0.4);
        }

        #stop-btn:hover {
            background-color: #e53935;
            color: white;
            box-shadow: 0 0 25px rgba(229, 57, 53, 0.8), 0 0 5px rgba(229, 57, 53, 1);
        }

        #status {
            margin-top: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #00e5ff;
            min-height: 25px;
            transition: all 0.3s ease;
            animation: fadeIn 1s ease-out 1s forwards;
            opacity: 0;
        }
    </style>
</head>
<body>

    <h1>Indian Currency Detection</h1>
    <div class="button-container">
        <button class="feature-btn" id="startDetectionBtn">Start Detection</button>
        <button class="feature-btn" id="stop-btn">Stop Detection</button>
    </div>
    <div id="status"></div>

    <script>
        const btn = document.getElementById('startDetectionBtn');
        const statusDiv = document.getElementById('status');

        btn.addEventListener('click', () => {
            statusDiv.innerText = "Starting detection...";
            fetch('/start_currency_detection', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    statusDiv.innerText = data.status;
                })
                .catch(err => {
                    statusDiv.innerText = "Error starting detection.";
                    console.error(err);
                });
        });

        document.getElementById('stop-btn').addEventListener('click', () => {
            fetch('/stop_currency_detection', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    statusDiv.innerText = data.status;
                })
                .catch(err => {
                    statusDiv.innerText = "Error stopping detection.";
                    console.error(err);
                });
        });
    </script>

</body>
</html>
