<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YOLO Detection Control</title>
    <style>
        /* Reset some default styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom right, #6a11cb, #2575fc);
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        .btn {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2575fc;
            background-color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            margin: 10px;
        }

        .btn:hover {
            background-color: #e6e6e6;
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        #status {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <h1>YOLOv8 Hindi Object Detection</h1>
    <button class="btn" onclick="startDetection()">Start Detection</button>
    <button class="btn" onclick="stopDetection()">Stop Detection</button>
    <p id="status"></p>

    <script>
        async function startDetection() {
            const response = await fetch('/start_detection', {method: 'POST'});
            const data = await response.json();
            document.getElementById('status').innerText = data.status;
        }

        async function stopDetection() {
            const response = await fetch('/stop_detection', {method: 'POST'});
            const data = await response.json();
            document.getElementById('status').innerText = data.status;
        }
    </script>
</body>
</html>
